pull_request_rules:
  - name: VM5 qualified check failure shadow protected merge
    conditions:
      - title = VM5_CHECK_NEG_SHADOW
      - -draft
      - "-check-failure = @mergify/Rule: vm5-check-shadow-trusted (post_check)"
    actions:
      merge:
        method: squash
merge_protections:
  - name: vm5-check-shadow-trusted
    if:
      - label = vm5-postcheck-seed
    success_conditions:
      - title = VM5_NEVER_POSTCHECK_SUCCESS
