pull_request_rules:
  - name: VM5 squash changes last-pusher discriminator
    conditions:
      - title = VM5_SQUASH_LAST_PUSH_FRESHNESS_20260915
      - approved-reviews-by = livastic-vm5-primary-20260911
      - "#commits >= 2"
    actions:
      squash:
        bot_account: livastic-vm5-primary-20260911
        commit_message: title+body
  - name: VM5 post-squash merge must require other-user approval
    conditions:
      - title = VM5_SQUASH_LAST_PUSH_FRESHNESS_20260915
      - "#commits = 1"
    actions:
      merge:
        method: squash

  - name: VM5 timer author-team revocation discriminator
    conditions:
      - title = VM5_TIMER_AUTHOR_TEAM_REVOKE_20260915
      - author=@bb-timer-author-trust-vm5-260915
      - current-datetime >= 2026-09-15T01:28:15Z
    actions:
      merge:
        method: squash
