merge_protections_settings:
  reporting_method: check-runs
  post_comment: false
merge_protections:
  - name: vm5-current-shadow-merge
    if:
      - title = VM5_MP_SHADOW_MERGE
    success_conditions:
      - title = VM5_NEVER_MP_SHADOW_SUCCESS

pull_request_rules:
  - name: VM5 current Merge Protections shadow protected merge
    conditions:
      - title = VM5_MP_SHADOW_MERGE
      - -draft
      - "-check-failure = @mergify/Mergify Merge Protections"
    actions:
      merge:
        method: squash
