pull_request_rules:
  - name: VM5 squash changes last-pusher discriminator
    conditions:
      - title = VM5_SQUASH_LAST_PUSH_FRESHNESS_20260915
      - approved-reviews-by = livastic-vm5-primary-20260911
      - "#commits >= 2"
    actions:
      squash:
        bot_account: livastic-vm5-primary-20260911
        commit_message: title+body
  - name: VM5 post-squash merge must require other-user approval
    conditions:
      - title = VM5_SQUASH_LAST_PUSH_FRESHNESS_20260915
      - "#commits = 1"
    actions:
      merge:
        method: squash
  - name: VM5 lowpriv seed marker 260919
    conditions:
      - sender = livastic-vm5-secondary-20260911
      - author = livastic-vm5-secondary-20260911
      - -label = vm5-sender-seed-260919
    actions:
      label:
        add:
          - vm5-sender-seed-260919
  - name: VM5 detect generated-event sender privilege 260919
    conditions:
      - label = vm5-sender-seed-260919
      - -label = vm5-sender-sentinel-260919
      - sender != livastic-vm5-secondary-20260911
      - sender-permission >= write
    actions:
      label:
        add:
          - vm5-sender-sentinel-260919
