pull_request_rules:
  - name: VM5 squash before stale-review merge discriminator
    conditions:
      - title = VM5_SQUASH_REVIEW_FRESHNESS_20260915
      - approved-reviews-by = livastic-vm5-primary-20260911
      - "#commits >= 2"
    actions:
      squash:
        bot_account: livastic-vm5-primary-20260911
        commit_message: title+body
  - name: VM5 post-squash merge must require fresh approval
    conditions:
      - title = VM5_SQUASH_REVIEW_FRESHNESS_20260915
      - "#commits = 1"
    actions:
      merge:
        method: squash
