scopes:
  source:
    files:
      bulk:
        include:
          - bulk/**
      docs:
        include:
          - docs/**
  barrier_files:
    include:
      - zzzz-barrier/**

merge_queue:
  mode: parallel
  max_parallel_checks: 2

queue_rules:
  - name: default
    queue_conditions: []
    merge_conditions:
      - label = vm5-barrier-release
    batch_size: 1
pull_request_rules: []
