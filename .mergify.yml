merge_protections_settings:
  reporting_method: deployments
  post_comment: false
merge_protections:
  - name: vm5-deployment-reporting-protection
    if:
      - title = VM5_MP_DEPLOY_REPORTING
    success_conditions:
      - title = VM5_NEVER_MP_DEPLOY_SUCCESS

pull_request_rules:
  - name: VM5 deployment-reporting safety injection probe
    conditions:
      - title = VM5_MP_DEPLOY_REPORTING
    actions:
      merge:
        method: squash
