name: VM5 deployment status creator proof
on:
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
      environment:
        required: true
        type: string
permissions:
  contents: read
  deployments: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.sha }}
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          python3 - <<'PY2'
          import json,os,urllib.request
          repo=os.environ['GITHUB_REPOSITORY'];token=os.environ['GH_TOKEN'];h={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}
          dep={'ref':os.environ['TARGET_SHA'],'environment':os.environ['TARGET_ENV'],'auto_merge':False,'required_contexts':[]}
          q=urllib.request.Request(f'https://api.github.com/repos/{repo}/deployments',data=json.dumps(dep).encode(),headers=h,method='POST')
          with urllib.request.urlopen(q) as r:d=json.load(r)
          q=urllib.request.Request(f'https://api.github.com/repos/{repo}/deployments/{d["id"]}/statuses',data=json.dumps({'state':'failure','environment':os.environ['TARGET_ENV']}).encode(),headers=h,method='POST')
          with urllib.request.urlopen(q) as r:s=json.load(r)
          print(json.dumps({'deployment_id':d['id'],'deployment_creator':d['creator']['login'],'status_id':s['id'],'status_creator':s['creator']['login'],'state':s['state']}))
          PY2
