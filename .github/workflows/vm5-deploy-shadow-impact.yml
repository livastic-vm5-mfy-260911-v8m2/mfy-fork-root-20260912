name: VM5 deployment shadow trusted-main impact proof
on:
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
      environment:
        required: true
        type: string
  push:
    branches: [main]
permissions:
  contents: write
  deployments: write
jobs:
  fail-deployment:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Publish trusted GitHub-Actions failure deployment
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.sha }}
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          python3 - <<'PY2'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          h={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}
          dep={'ref':os.environ['TARGET_SHA'],'environment':os.environ['TARGET_ENV'],'auto_merge':False,'required_contexts':[]}
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/deployments',data=json.dumps(dep).encode(),headers=h,method='POST')
          with urllib.request.urlopen(req) as r: d=json.load(r)
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/deployments/{d["id"]}/statuses',data=json.dumps({'state':'failure','environment':os.environ['TARGET_ENV']}).encode(),headers=h,method='POST')
          with urllib.request.urlopen(req) as r: s=json.load(r)
          print(json.dumps({'deployment_id':d['id'],'deployment_creator':d['creator']['login'],'status_id':s['id'],'status_creator':s['creator']['login'],'state':s['state']}))
          PY2
  prove-trusted-main:
    if: github.event_name == 'push' && github.actor == 'mergify[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Write trusted-main contents-write marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY2'
          import base64,json,os,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          branch=f'vm5-deploy-shadow-token-write-{os.environ["GITHUB_RUN_ID"]}'
          h={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}
          ref={'ref':'refs/heads/'+branch,'sha':os.environ['GITHUB_SHA']}
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/git/refs',data=json.dumps(ref).encode(),method='POST',headers=h)
          with urllib.request.urlopen(req) as r: print('BRANCH_WRITE_HTTP='+str(r.status))
          body={'message':'VM5 deployment-shadow trusted-main marker','content':base64.b64encode(b'VM5_DEPLOY_SHADOW_TRUSTED_MAIN_WRITE\n').decode(),'branch':branch}
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/vm5-deploy-shadow-impact-marker.txt',data=json.dumps(body).encode(),method='PUT',headers=h)
          with urllib.request.urlopen(req) as r: print('MARKER_WRITE_HTTP='+str(r.status))
          PY2
