name: VM5 GitRefs Provider Provenance POC

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-24.04
    outputs:
      control_security: ${{ fromJSON(steps.control.outputs.scopes).security }}
      attack_security: ${{ fromJSON(steps.after.outputs.scopes).security }}
    steps:
      - uses: actions/checkout@v5
      - name: Control scope detection before project preflight
        id: control
        uses: Mergifyio/gha-mergify-ci@v25
        with:
          action: scopes
          mergify_cli_version: latest
      - name: Run project preflight from the pull request checkout
        run: sh ci/preflight.sh
      - name: Scope detection after project preflight
        id: after
        uses: Mergifyio/gha-mergify-ci@v25
        with:
          action: scopes
          mergify_cli_version: latest
      - name: Assert provenance differential
        env:
          CONTROL: ${{ fromJSON(steps.control.outputs.scopes).security }}
          AFTER: ${{ fromJSON(steps.after.outputs.scopes).security }}
        run: |
          echo "control_security=$CONTROL"
          echo "after_preflight_security=$AFTER"
          test "$CONTROL" = "true"
          test "$AFTER" = "false"

  security-test:
    needs: detect
    if: ${{ needs.detect.outputs.attack_security == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Intentional security failure
        run: |
          echo "VM5_SECURITY_JOB_RAN=1"
          exit 1

  ci-gate:
    if: ${{ !cancelled() }}
    needs:
      - detect
      - security-test
    runs-on: ubuntu-24.04
    steps:
      - name: Aggregate required jobs
        uses: Mergifyio/gha-mergify-ci@v25
        with:
          action: wait-jobs
          jobs: ${{ toJSON(needs) }}
