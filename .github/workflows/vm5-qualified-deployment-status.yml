name: VM5 Qualified Deployment Status Creator
on:
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
jobs:
  create-trusted-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: create deployment and failing status with workflow token
        env:
          GH_TOKEN: ${{ github.token }}
          ENV_NAME: vm5-dep-status-creator-260914
        shell: bash
        run: |
          set -euo pipefail
          body=$(jq -nc --arg ref "$GITHUB_SHA" --arg env "$ENV_NAME" '{ref:$ref,environment:$env,auto_merge:false,required_contexts:[]}')
          dep=$(curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/deployments" \
            -d "$body")
          id=$(jq -er '.id' <<<"$dep")
          status=$(jq -nc --arg env "$ENV_NAME" '{state:"failure",environment:$env}')
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/deployments/$id/statuses" \
            -d "$status" >/dev/null
