name: VM5 Duplicate Check Run Freshness

on:
  push:
    branches:
      - bb-duplicate-check-260912
  workflow_dispatch:
    inputs:
      should_fail:
        description: Fail this independent run
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  status:
    name: vm5-duplicate-check
    runs-on: ubuntu-latest
    steps:
      - name: Controlled independent-run outcome
        run: |
          echo "event=${{ github.event_name }}"
          echo "sha=${{ github.sha }}"
          echo "should_fail=${{ inputs.should_fail }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.should_fail }}" = "true" ]; then
            echo "controlled independent run failure"
            exit 1
          fi
          echo "controlled push success"
