name: VM5 AutoRetry Rule Revocation
run-name: VM5 retry-revoke ${{ inputs.hold_seconds }}
on:
  workflow_dispatch:
    inputs:
      hold_seconds:
        description: Controlled delay before attempt-1 failure
        required: true
        default: "5"
permissions:
  contents: write
jobs:
  retry-target:
    runs-on: ubuntu-latest
    steps:
      - name: hold attempt one
        if: ${{ github.run_attempt == 1 }}
        shell: bash
        run: sleep "${{ inputs.hold_seconds }}"
      - name: fail attempt one
        if: ${{ github.run_attempt == 1 }}
        shell: bash
        run: exit 1
      - name: write marker only on retry
        if: ${{ github.run_attempt > 1 }}
        env:
          GH_TOKEN: ${{ github.token }}
          MARKER_BRANCH: vm5-autoretry-revocation-write-260914
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          base_sha=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api/git/ref/heads/main" | jq -er '.object.sha')
          code=$(curl -sS -o /tmp/ref.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$api/git/refs" -d "$(jq -nc --arg r "refs/heads/$MARKER_BRANCH" --arg s "$base_sha" '{ref:$r,sha:$s}')")
          if [[ "$code" != "201" && "$code" != "422" ]]; then cat /tmp/ref.json; exit 1; fi
          content=$(printf 'Mergify Auto-Retry attempt=%s run=%s\n' "$GITHUB_RUN_ATTEMPT" "$GITHUB_RUN_ID" | base64 -w0)
          old_sha=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api/contents/vm5-autoretry-revocation.txt?ref=$MARKER_BRANCH" | jq -r '.sha // empty')
          body=$(jq -nc --arg m "test: Auto-Retry rule revocation attempt $GITHUB_RUN_ATTEMPT" --arg c "$content" --arg b "$MARKER_BRANCH" --arg s "$old_sha" 'if $s=="" then {message:$m,content:$c,branch:$b} else {message:$m,content:$c,branch:$b,sha:$s} end')
          curl -fsSL -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api/contents/vm5-autoretry-revocation.txt" -d "$body" >/dev/null
