name: VM5 Native Protection Inflight
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Delay speculative result
        if: ${{ startsWith(github.head_ref, 'mergify/merge-queue/') }}
        run: sleep 45
      - run: echo guard-pass
