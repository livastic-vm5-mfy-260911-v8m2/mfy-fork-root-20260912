name: VM5 large PR trusted-main proof
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  prove:
    if: github.actor == 'mergify[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Write large-PR trusted-main token marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY2'
          import base64,json,os,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          body={'message':'VM5 large-PR trusted-main token marker','content':base64.b64encode(b'VM5_LARGEPR_TRUSTED_MAIN_TOKEN_WRITE\n').decode(),'branch':'main'}
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/vm5-largepr-trusted-main-marker.txt',data=json.dumps(body).encode(),method='PUT',headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
          with urllib.request.urlopen(req) as r: print('MARKER_WRITE_HTTP='+str(r.status))
          PY2
