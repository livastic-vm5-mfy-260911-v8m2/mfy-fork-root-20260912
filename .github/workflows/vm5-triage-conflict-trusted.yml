name: VM5 triage stale conflict trusted proof
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - name: Write controlled trusted-main marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY2'
          import base64, json, os, urllib.request, urllib.error
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          body={'message':'VM5 triage stale conflict trusted marker','content':base64.b64encode(b'VM5_TRIAGE_STALE_CONFLICT_TRUSTED_WORKFLOW\n').decode(),'branch':'main'}
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/vm5-triage-conflict-trusted-marker.txt',data=json.dumps(body).encode(),headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},method='PUT')
          with urllib.request.urlopen(req) as r: print('MARKER_WRITE_HTTP='+str(r.status))
          PY2
