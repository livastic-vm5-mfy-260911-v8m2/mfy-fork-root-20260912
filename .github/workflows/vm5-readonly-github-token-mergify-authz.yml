name: VM5 Readonly GitHub Token Mergify Authz
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Mergify with read-only GITHUB_TOKEN
        env:
          GH_TOKEN_VALUE: ${{ github.token }}
        shell: bash
        run: |
          set +e
          URL="https://api.mergify.com/v1/repos/livastic-vm5-mfy-260911-v8m2/mfy-fork-root-20260912/merge-queue/pause"
          GET_CODE=$(curl -sS -o /tmp/mfy-get -w '%{http_code}' -H "Authorization: Bearer ${GH_TOKEN_VALUE}" "$URL")
          PUT_CODE=$(curl -sS -o /tmp/mfy-put -w '%{http_code}' -X PUT -H "Authorization: Bearer ${GH_TOKEN_VALUE}" -H 'Content-Type: application/json' --data '{"reason":"VM5 read-only GITHUB_TOKEN authz discriminator 20260915"}' "$URL")
          echo "GET_CODE=${GET_CODE}"
          echo "PUT_CODE=${PUT_CODE}"
          echo "GET_BODY=$(cat /tmp/mfy-get)"
          echo "PUT_BODY=$(cat /tmp/mfy-put)"
          if [ "$PUT_CODE" = "200" ]; then
            DEL_CODE=$(curl -sS -o /tmp/mfy-del -w '%{http_code}' -X DELETE -H "Authorization: Bearer ${GH_TOKEN_VALUE}" "$URL")
            echo "CLEANUP_DELETE_CODE=${DEL_CODE}"
            echo "CLEANUP_DELETE_BODY=$(cat /tmp/mfy-del)"
          fi
