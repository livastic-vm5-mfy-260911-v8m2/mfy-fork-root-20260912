name: VM5 copy secret trust promotion
on:
  pull_request:
    branches:
      - main
      - vm5-copy-target-20260915
jobs:
  secret-boundary:
    runs-on: ubuntu-latest
    env:
      VM5_COPY_PROMOTION_CANARY: ${{ secrets.VM5_COPY_PROMOTION_CANARY }}
    steps:
      - uses: actions/checkout@v4
      - name: Run trusted repository script
        run: bash ci/vm5-copy-secret-probe.sh
