name: VM5 Deployment Latest Outcome Probe

on:
  workflow_dispatch:
    inputs:
      should_fail:
        description: Fail this deployment
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: vm5-deployment-latest-260912
    steps:
      - name: Deployment outcome
        run: |
          echo "should_fail=${{ inputs.should_fail }}"
          if [ "${{ inputs.should_fail }}" = "true" ]; then
            echo "controlled deployment failure"
            exit 1
          fi
          echo "controlled deployment success"

