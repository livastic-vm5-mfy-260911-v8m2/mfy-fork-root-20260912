name: VM5 PR Target Test Insights Provenance
on:
  workflow_dispatch:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  vm5-provenance-test:
    runs-on: ubuntu-latest
    env:
      MERGIFY_TOKEN: ${{ vars.VM5_MERGIFY_CI_TOKEN }}
      VM5_FAIL: ${{ github.event_name == 'pull_request_target' && contains(github.event.pull_request.title, '[vm5-fail]') }}
    steps:
      - name: Record safe event provenance
        shell: bash
        run: |
          echo "EVENT=${GITHUB_EVENT_NAME}"
          echo "SHA=${GITHUB_SHA}"
          echo "HEAD_REF=${GITHUB_HEAD_REF}"
          echo "BASE_REF=${GITHUB_BASE_REF}"
          echo "REF=${GITHUB_REF}"
      - name: Install pytest Mergify client
        run: python -m pip install --disable-pip-version-check pytest pytest-mergify
      - name: Create trusted synthetic test
        shell: bash
        run: |
          cat > test_vm5_prtarget_provenance.py <<'PY'
          import os
          def test_vm5_prtarget_provenance_unique_260913():
              assert os.environ.get("VM5_FAIL", "false").lower() != "true"
          PY
      - name: Run pytest with Mergify upload
        run: python -m pytest -q test_vm5_prtarget_provenance.py
