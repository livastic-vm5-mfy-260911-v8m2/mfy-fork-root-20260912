name: vm5-review-comment-probe

on:
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

jobs:
  vm5-review-comment-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Record event context
        run: |
          echo "event=$GITHUB_EVENT_NAME"
          echo "sha=$GITHUB_SHA"
          echo "ref=$GITHUB_REF"
