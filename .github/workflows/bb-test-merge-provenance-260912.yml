name: VM5 Test-Merge Required Check Provenance

on:
  push:
    branches:
      - bb-check-provenance-260912
  pull_request:
    branches:
      - main

jobs:
  provenance:
    name: vm5-test-merge-provenance
    runs-on: ubuntu-latest
    steps:
      - name: Controlled outcome by event
        run: |
          echo "event=${{ github.event_name }}"
          echo "sha=${{ github.sha }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "controlled synthetic merge failure"
            exit 1
          fi
          echo "controlled head success"
