name: VM5 Serial Base Guard
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delay speculative queue validation
        if: ${{ startsWith(github.head_ref, 'mergify/merge-queue/') }}
        run: sleep 45
      - name: Reject combined A+B state
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f vm5-serial-a.txt && -f vm5-serial-b.txt ]]; then
            echo 'A+B combined state is invalid' >&2
            exit 1
          fi
          echo 'guard pass'
