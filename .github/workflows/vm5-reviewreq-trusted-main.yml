name: VM5 review-requested trusted-main proof
on:
  push:
    branches: [main]
    paths: [vm5-reviewreq-chain-source.txt]
permissions:
  contents: write
jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - name: Write controlled trusted-main token marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY2'
          import base64,json,os,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          body={'message':'VM5 review-requested trusted-main token marker','content':base64.b64encode(b'VM5_REVIEW_REQUESTED_TRUSTED_MAIN_TOKEN_WRITE\n').decode(),'branch':'main'}
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/vm5-reviewreq-trusted-main-marker.txt',data=json.dumps(body).encode(),method='PUT',headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
          with urllib.request.urlopen(req) as r: print('MARKER_WRITE_HTTP='+str(r.status))
          PY2
