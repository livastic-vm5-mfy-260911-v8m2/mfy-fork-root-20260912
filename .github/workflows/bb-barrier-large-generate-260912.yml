name: VM5 Barrier Large Generator

on:
  push:
    branches:
      - bb-barrier-large-260912

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate 3000+ file barrier probe
        run: |
          set -euo pipefail
          if [ -f .barrier-large-generated ]; then
            exit 0
          fi
          for f in bulk/*.txt; do
            printf 'barrier-large-probe\n' >> "$f"
          done
          mkdir -p zzzz-barrier
          printf 'barrier-large-tail\n' > zzzz-barrier/large.txt
          printf 'generated\n' > .barrier-large-generated
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bulk zzzz-barrier .barrier-large-generated
          git commit -m 'Generate 3000+ file barrier probe'
          git push origin HEAD:bb-barrier-large-260912
