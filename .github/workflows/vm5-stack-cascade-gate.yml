name: VM5 Stack Cascade Gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: vm5-stack-cascade-gate
    runs-on: ubuntu-24.04
    steps:
      - name: Fail only predecessor speculative draft
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$PR_BODY"
          if printf '%s\n' "$PR_BODY" | grep -Eq '^[[:space:]]*-[[:space:]]+number:[[:space:]]*184([[:space:]]|$)'; then
            echo 'VM5 predecessor #184 draft intentionally fails'
            exit 1
          fi
          echo 'VM5 non-predecessor draft passes'
